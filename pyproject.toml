[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dv4calib"
version = "0.4.0"
description = "Active camera-to-robot calibration from robot masks with a differentiable A-optimal risk (D v4)"
readme = "README.md"
requires-python = ">=3.10,<3.12"          # sapien 2.2.2 wheels: CPython 3.10-3.11, Linux
dependencies = [
  "torch>=2.0",
  "numpy>=1.24,<2",
  "scipy",
  "trimesh",
  "opencv-python",
  "imageio",
  "sapien==2.2.2",
  "mplib==0.2.1",
  "motion-planning==0.1.3",
  "pin==2.6.21",
]
# nvdiffrast is installed separately from GitHub without build isolation (see README).

[project.scripts]
dv4calib = "dv4calib.cli:main"

[tool.setuptools]
license-files = ["NOTICE.md", "third_party_licenses/EasyHeC-MIT.txt", "third_party_licenses/pytorch3d-BSD.txt",
                 "third_party_licenses/xarm_ros-BSD-3-Clause.txt"]

[tool.setuptools.packages.find]
include = ["dv4calib*"]

[tool.setuptools.package-data]
dv4calib = ["assets/xarm7/**/*"]
